# First-time only: answers the Let's Encrypt check on plain HTTP until the certificate exists.
# deploy/deploy.sh replaces it with nginx-preview.conf once certbot has issued the certificate.
server {
    listen 80;
    server_name preview.chakravue.ai;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 503 "Preview is being set up"; }
}
