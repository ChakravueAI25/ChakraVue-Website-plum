# preview.chakravue.ai: the private website preview (static files, password protected).
# Installed by deploy/deploy.sh as /etc/nginx/sites-available/chakravue-preview.
# Same pattern as the trials sites on this server: certbot (webroot) certificates, nginx terminates TLS.

server {
    listen 80;
    server_name preview.chakravue.ai;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # nginx 1.24 on this server (the 'http2 on' directive needs 1.25+)
    server_name preview.chakravue.ai;
    ssl_certificate     /etc/letsencrypt/live/preview.chakravue.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.chakravue.ai/privkey.pem;

    root /var/www/chakravue-preview;
    index index.html;

    # the whole preview is behind one team password
    auth_basic "ChakraVue AI preview";
    auth_basic_user_file /etc/nginx/chakravue-preview.htpasswd;

    # never indexed, never framed by other sites
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt { auth_basic off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
}
